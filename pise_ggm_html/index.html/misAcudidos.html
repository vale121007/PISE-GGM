<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Acudidos | PISE-GGM</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  :root { --verde:#198754; --verde-osc:#14532d; }
  body { background:#f6f8f7; }

  .bienvenida {
    background: linear-gradient(135deg, #198754, #14532d);
    color: #fff;
    border-radius: 14px;
    padding: 32px;
    margin-bottom: 32px;
  }

  .caja {
    background:#fff;
    border:none;
    border-radius:14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    padding:1.5rem;
  }
</style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <img src="ESCUDOGGM.jpg" alt="Escudo del colegio" width="50">
      <a class="navbar-brand ms-2" href="acudiente.html">PISE-GGM</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span id="nombreUsuario" class="fw-semibold"></span>
        <button class="btn btn-outline-danger btn-sm" id="btnCerrarSesion">
          <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <div class="bienvenida">
      <a href="acudiente.html" class="text-white text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
        <i class="bi bi-arrow-left"></i> <span class="small">Volver al panel</span>
      </a>
      <h1 class="h3 mb-1">Mis Acudidos</h1>
      <p class="mb-0">Estudiantes a tu cargo — Colegio Gabriel García Márquez</p>
    </div>

    <div id="aviso" class="alert d-none"></div>

    <div class="caja">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Estudiante</th>
              <th>Documento</th>
              <th>Curso</th>
            </tr>
          </thead>
          <tbody id="tbAcudidos">
            <tr><td colspan="3" class="text-muted">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <footer class="footer mt-5">
    <div class="container">
      <p class="text-muted small mb-0">© 2026 Colegio Gabriel García Márquez. Todos los derechos reservados.</p>
    </div>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ============================================================
  // AJUSTA AQUÍ si tu backend usa otra ruta para "acudidos"
  // Se asume: GET /api/acudiente/{idUsuario}/acudidos
  // Respuesta esperada por estudiante: { idEstudiante, nombre, apellido, documento, curso }
  // ============================================================
  const API = "http://localhost:8082/api/acudiente";

  // Guardia de sesión
  const token = localStorage.getItem("token");
  const usuarioRaw = localStorage.getItem("usuario");
  if (!token || !usuarioRaw) { window.location.href = "login.html"; }

  const usuario = JSON.parse(usuarioRaw);
  const rol = ((usuario.rol && usuario.rol.nombreRol) || usuario.rol || "").trim();
  if (rol.toUpperCase() !== "ACUDIENTE") { window.location.href = "login.html"; }

  document.getElementById("nombreUsuario").textContent = usuario.nombre + " " + usuario.apellido;

  document.getElementById("btnCerrarSesion").addEventListener("click", function () {
    localStorage.removeItem("token");
    localStorage.removeItem("usuario");
    localStorage.removeItem("idPerfil");
    window.location.href = "login.html";
  });

  const BASE = `${API}/${usuario.idUsuario}`;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  function avisar(msg, tipo = "danger") {
    const a = document.getElementById("aviso");
    a.className = `alert alert-${tipo}`;
    a.textContent = msg;
    a.classList.remove("d-none");
  }

  async function cargarAcudidos() {
    const tb = document.getElementById("tbAcudidos");
    try {
      const r = await fetch(`${BASE}/acudidos`, {
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }
      });
      if (!r.ok) throw new Error("Error " + r.status + " al consultar tus acudidos.");
      const lista = await r.json();

      tb.innerHTML = lista.length ? lista.map(e => `
        <tr>
          <td>${esc(e.nombre)} ${esc(e.apellido)}</td>
          <td>${esc(e.documento)}</td>
          <td>${esc(e.curso)}</td>
        </tr>`).join("")
        : `<tr><td colspan="3" class="text-muted">No tienes estudiantes a cargo registrados.</td></tr>`;
    } catch (e) {
      tb.innerHTML = `<tr><td colspan="3" class="text-muted">No se pudo cargar la información.</td></tr>`;
      avisar(e.message);
    }
  }

  cargarAcudidos();
</script>
</body>
</html>
