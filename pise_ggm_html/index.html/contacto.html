<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contacto</title>

<style>
body { 
  font-family: Arial; 
  margin:0;   
  background: url(ANIMADOCOLGGM.png) no-repeat center center/cover;
  position: relative;
}

/* OSCURECER FONDO */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: -1;
}

/* HEADER */
header {
  background: white;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

header h1 {
  color: #285900;
  font-size: 20px;
}

nav a {
  margin: 0 10px;
  text-decoration: none;
  color: #333;
  font-size: 14px;
}

nav a:hover {
  text-decoration: underline;
}

/* CONTENEDOR */
.container {
  padding:40px;
  text-align:center;
}

.container h1{
  color: #ffffff;
}

/* FORMULARIO */
.form-box {
  background: rgba(255,255,255,0.9);
  max-width: 500px;
  margin: auto;
  padding: 30px;
  border-radius: 15px;
  text-align: left;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* LABELS */
.form-box label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
  color: #285900;
}

/* INPUTS Y TEXTAREA */
.form-box input,
.form-box textarea {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* TEXTAREA */
.form-box textarea {
  height: 100px;
  resize: none;
}

/* BOTÓN */
.form-box button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  background: #2e7d32;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.form-box button:hover {
  background: #1b5e20;
}

/* FOOTER */
footer {
  background: #29860a;
  color: white;
  text-align: center;
  padding: 5px;
  margin-top: 80px;
}
</style>

</head>

<body>

<header>
  <h1>PISE-GGM</h1>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="oferta.html">Oferta Academica</a>
    <a href="noticias.html">Noticias</a>
    <a href="quienessomos.html">¿Quienes somos?</a>
    <a href="calendario.html">Calendario</a>
    <a href="matriculas.html">Matriculas</a>
    <a href="contacto.html">Contacto</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<div class="container">
  <h1>Contacto</h1>

  <form class="form-box" onsubmit="return enviarFormulario()">

    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>

    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" placeholder="Ingresa tu correo" required>

    <label for="mensaje">Escribe tu solicitud</label>
    <textarea id="mensaje" placeholder="Escribe tu mensaje" required></textarea>

    <button type="submit">Enviar</button>

  </form>
</div>

<footer>
  <p>©2026 PISE-GGM</p>
</footer>

<script>
function enviarFormulario(){
  alert("Mensaje enviado correctamente");
  return false;
}
</script>

</body>
</html>
