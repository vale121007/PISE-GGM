<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de Asignaturas | PISE-GGM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    .cabecera {
      background: linear-gradient(135deg, #198754, #14532d);
      color: #fff;
      border-radius: 14px;
      padding: 24px 32px;
      margin-bottom: 24px;
    }
    .tabla-reporte th {
      background: #198754;
      color: #fff;
      font-size: .9rem;
    }
    .tabla-reporte td {
      font-size: .9rem;
      vertical-align: middle;
    }
  </style>
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-success" href="administrador.html">PISE-GGM</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span id="nombreUsuario" class="fw-semibold"></span>
        <a href="administrador.html" class="btn btn-outline-success btn-sm">
          <i class="bi bi-arrow-left"></i> Volver al panel
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <div class="cabecera">
      <h1 class="h4 mb-1">Reporte de Asignaturas</h1>
      <p class="mb-0 small">Asignaturas del colegio, sus horas semanales y el docente que las dicta</p>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-8">
        <label class="form-label small fw-semibold">Buscar</label>
        <input type="text" id="buscador" class="form-control" placeholder="Nombre de la asignatura o docente...">
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <span class="badge bg-secondary fs-6" id="contador">0 registros</span>
      </div>
    </div>

    <div class="table-responsive bg-white rounded shadow-sm">
      <table class="table table-striped table-hover mb-0 tabla-reporte">
        <thead>
          <tr>
            <th>#</th>
            <th>Asignatura</th>
            <th>Horas semanales</th>
            <th>Docente</th>
            <th>Documento docente</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla">
          <tr><td colspan="5" class="text-center text-muted py-4">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>

    const API_BASE = "http://localhost:8082/api/reportes";

    const token = localStorage.getItem("token");
    const usuarioRaw = localStorage.getItem("usuario");

    if (!token || !usuarioRaw) {
      window.location.href = "login.html";
    }

    const usuarioSesion = JSON.parse(usuarioRaw);
    const rolSesion = ((usuarioSesion.rol && usuarioSesion.rol.nombreRol) || "").trim();

    if (rolSesion.toUpperCase() !== "ADMINISTRADOR") {
      window.location.href = "login.html";
    }

    document.getElementById("nombreUsuario").textContent =
      usuarioSesion.nombre + " " + usuarioSesion.apellido;

    let asignaturas = [];

    async function cargarAsignaturas() {
      mostrarCargando();
      try {
        const respuesta = await fetch(API_BASE + "/asignaturas");
        if (!respuesta.ok) throw new Error("El servidor respondió con error");
        asignaturas = await respuesta.json();
        pintarTabla();
      } catch (error) {
        console.error(error);
        mostrarError("No se pudo conectar con el servidor. Verifica que el backend esté encendido.");
      }
    }

    function pintarTabla() {

      const texto = document.getElementById("buscador").value.trim().toLowerCase();

      const filtrados = asignaturas.filter(function (a) {
        if (texto === "") return true;
        const nombre = (a.nombreAsignatura || "").toLowerCase();
        const docente = (a.docenteNombre || "").toLowerCase();
        return nombre.includes(texto) || docente.includes(texto);
      });

      const cuerpo = document.getElementById("cuerpoTabla");
      document.getElementById("contador").textContent = filtrados.length + " registros";

      if (filtrados.length === 0) {
        cuerpo.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Sin resultados</td></tr>';
        return;
      }

      cuerpo.innerHTML = filtrados.map(function (a, indice) {
        return "<tr>" +
          "<td>" + (indice + 1) + "</td>" +
          "<td>" + limpiar(a.nombreAsignatura) + "</td>" +
          "<td>" + limpiar(a.horasSemanales) + "</td>" +
          "<td>" + limpiar(a.docenteNombre) + "</td>" +
          "<td>" + limpiar(a.docenteDocumento) + "</td>" +
          "</tr>";
      }).join("");
    }

    function mostrarCargando() {
      document.getElementById("cuerpoTabla").innerHTML =
        '<tr><td colspan="5" class="text-center text-muted py-4">Cargando...</td></tr>';
    }

    function mostrarError(mensaje) {
      document.getElementById("cuerpoTabla").innerHTML =
        '<tr><td colspan="5" class="text-center text-danger py-4">' + mensaje + "</td></tr>";
      document.getElementById("contador").textContent = "0 registros";
    }

    function limpiar(valor) {
      if (valor === null || valor === undefined || valor === "") return "—";
      return String(valor).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById("buscador").addEventListener("input", pintarTabla);

    cargarAsignaturas();

  </script>

</body>
</html>
