<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Acudiente | PISE-GGM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .panel-card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      transition: transform .15s ease, box-shadow .15s ease;
      height: 100%;
    }
    .panel-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
    }
    .panel-card i {
      font-size: 2rem;
      color: #198754;
    }
    .bienvenida {
      background: linear-gradient(135deg, #198754, #14532d);
      color: #fff;
      border-radius: 14px;
      padding: 32px;
      margin-bottom: 32px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <img src="ESCUDOGGM.jpg" alt="Escudo del colegio" width="50">
      <a class="navbar-brand ms-2" href="index.html">PISE-GGM</a>

      <div class="ms-auto d-flex align-items-center gap-3">
        <span id="nombreUsuario" class="fw-semibold"></span>
        <button class="btn btn-outline-danger btn-sm" id="btnCerrarSesion">
          <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <div class="bienvenida">
      <h1 class="h3 mb-1">Bienvenido, <span id="nombreBienvenida">Acudiente</span></h1>
      <p class="mb-0">Panel del Acudiente — Colegio Gabriel García Márquez</p>
    </div>

    <div class="row g-4">

      <div class="col-6 col-md-4 col-lg-4">
        <div class="card panel-card text-center p-4">
          <i class="bi bi-people-fill mb-2"></i>
          <h5>Mis Acudidos</h5>
          <p class="text-muted small mb-3">Ver los estudiantes a mi cargo</p>
          <a href="misAcudidos.html" class="btn btn-success btn-sm">Ir</a>
        </div>
      </div>

      <div class="col-6 col-md-4 col-lg-4">
        <div class="card panel-card text-center p-4">
          <i class="bi bi-clipboard-data-fill mb-2"></i>
          <h5>Notas</h5>
          <p class="text-muted small mb-3">Consultar las notas de mis acudidos</p>
          <a href="notasAcudidos.html" class="btn btn-success btn-sm">Ir</a>
        </div>
      </div>

      <div class="col-6 col-md-4 col-lg-4">
        <div class="card panel-card text-center p-4">
          <i class="bi bi-person-badge-fill mb-2"></i>
          <h5>Mi Perfil</h5>
          <p class="text-muted small mb-3">Ver mis datos personales</p>
          <a href="perfilAcudiente.html" class="btn btn-success btn-sm">Ir</a>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer mt-5">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 Colegio Gabriel García Márquez. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Guardia de sesión: si no hay token o el rol no es Acudiente, de vuelta al login.
    (function () {
      const token = localStorage.getItem("token");
      const usuarioRaw = localStorage.getItem("usuario");

      if (!token || !usuarioRaw) {
        window.location.href = "login.html";
        return;
      }

      let usuario;
      try {
        usuario = JSON.parse(usuarioRaw);
      } catch (e) {
        console.error("[guard] Error al parsear 'usuario' desde localStorage:", e);
        window.location.href = "login.html";
        return;
      }

      // .trim() por seguridad: evita que un espacio en blanco guardado en la BD
      // (o quedado en localStorage de una sesión anterior) rompa la comparación.
      const rol = (
        (usuario.rol && usuario.rol.nombreRol) ||
        (usuario.rol && usuario.rol.nombre) ||
        usuario.rol ||
        ""
      ).trim();

      if (rol.toUpperCase() !== "ACUDIENTE") {
        console.warn(`[guard] Rol detectado ("${rol}") no coincide con ACUDIENTE. Redirigiendo a login.`);
        window.location.href = "login.html";
        return;
      }

      document.getElementById("nombreUsuario").textContent = usuario.nombre + " " + usuario.apellido;
      document.getElementById("nombreBienvenida").textContent = usuario.nombre;
    })();

    document.getElementById("btnCerrarSesion").addEventListener("click", function () {
      localStorage.removeItem("token");
      localStorage.removeItem("usuario");
      localStorage.removeItem("idPerfil");
      window.location.href = "login.html";
    });
  </script>

</body>
</html>
