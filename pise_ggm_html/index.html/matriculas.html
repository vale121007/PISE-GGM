<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Matrículas</title>

<style>
body { 
  font-family: Arial; 
  margin:0;   
  background: url(ANIMADOCOLGGM.png) no-repeat center center/cover;
  position: relative;
}

/* OSCURECER FONDO */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: -1;
}

/* HEADER */
header {
  background: white;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  color: #285900;
}

nav a {
  margin: 0 10px;
  text-decoration: none;
  color: #333;
}

nav a:hover {
  color: #2e7d32;
}

/* CONTENIDO */
.container {
  padding:40px;
  text-align:center;
  color:white;
}

.container h1 {
  margin-bottom: 20px;
}

/* FORMULARIO */
.form-box {
  background: rgba(255,255,255,0.9);
  max-width: 500px;
  margin: auto;
  padding: 30px;
  border-radius: 15px;
  color: black;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* BOTÓN */
button {
  width: 100%;
  padding: 12px;
  background: #2e7d32;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #1b5e20;
}

/* FOOTER */
footer {
  background: #29860a;
  color: white;
  text-align: center;
  padding: 5px;
  margin-top: 50px;
}
</style>

</head>

<body>

<header>
  <h1>PISE-GGM</h1>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="oferta.html">Oferta Academica</a>
    <a href="quienessomos.html">¿Quienes somos?</a>
    <a href="calendario.html">Calendario</a>
    <a href="matriculas.html">Matriculas</a>
    <a href="contacto.html">Contacto</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<div class="container">
  <h1>Formulario de Matrícula</h1>

  <div class="form-box">
    <form onsubmit="return enviarFormulario()">
      
      <input type="text" placeholder="Nombre completo" required>
      <input type="text" placeholder="Documento" required>
      <input type="email" placeholder="Correo electrónico" required>

      <select required>
        <option value="">Seleccione grado</option>
        <option>Primaria</option>
        <option>Secundaria</option>
        <option>Bachillerato</option>
      </select>

      <input type="text" placeholder="Teléfono" required>

      <button>Enviar solicitud</button>

    </form>
  </div>
</div>

<footer>
  <p>©2026 PISE-GGM</p>
</footer>

<script>
function enviarFormulario(){
  alert("Matrícula enviada correctamente");
  return false;
}
</script>

</body>
</html>
