           <script>
    document.addEventListener("DOMContentLoaded", function() {

        const Formulario = document.getElementById("Formulario");
        const mensaje = document.getElementById("mensaje");

        Formulario.addEventListener("submit", function(e) {
            e.preventDefault();
            const ahora = new Date();

            let Nombre = document.getElementById("Nombre").value;
            let Documento = document.getElementById("Documento").value;
            let Correo = document.getElementById("Correo").value;
            let Teléfono = document.getElementById("Teléfono").value;
            let Fecha = document.getElementById("Fecha").value;

            const diffMs = ahora - new Date(Fecha);
            const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffAnios = Math.floor(diffDias / 365);
            console.log(diffAnios);

            // Validación de edad mínima 3 años
            if (diffAnios < 3) {
                mensaje.innerText = "Edad incorrecta: el niño debe tener al menos 3 años.";
                mensaje.className = "text-danger";
                return; // ← detiene el envío
            }

            // Validación de campos vacíos
            if (Nombre === "" || Documento === "" || Correo === "" || Teléfono === "" || Fecha === "") {
                mensaje.innerText = "Todos los campos son obligatorios.";
                mensaje.className = "text-danger";
                return;
            }

            // Si todo está bien
            mensaje.innerText = "Formulario enviado correctamente.";
            mensaje.className = "text-success";
        });

    });
</script>
