
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de Cursos | PISE-GGM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Estructura general */
    body.pn-body {
      background: var(--blanco);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .pn-main {
      flex: 1;
    }

    /* Usuario */
    .pn-usuario {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: .92rem;
      color: var(--verde-900);
      background: var(--verde-100);
      border: 1px solid var(--borde);
      padding: 7px 14px;
      border-radius: 4px 14px 4px 14px;
    }

    .pn-usuario i {
      color: var(--dorado-600);
    }

    :root[data-tema="noche"] .pn-usuario {
      color: var(--amarillo-300);
    }

    /* Botón volver */
    .nav-links a.nav-volver,
    .nav-links a.nav-volver:link,
    .nav-links a.nav-volver:visited {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: .92rem;
      font-weight: 700;
      background: var(--verde-700);
      color: #fff !important;
      padding: .6rem 1.2rem;
      border-radius: 30px;
      margin-left: 8px;
      text-decoration: none;
      transition: background .2s ease, transform .15s ease;
    }

    .nav-links a.nav-volver i {
      color: #fff !important;
    }

    .nav-links a.nav-volver:hover,
    .nav-links a.nav-volver:focus {
      background: var(--verde-900);
      color: #fff !important;
      transform: translateY(-1px);
    }

    @media (max-width: 880px) {
      .nav-links a.nav-volver {
        margin: 10px 4px 0;
        align-self: flex-start;
      }

      .pn-usuario {
        margin: 6px 4px 0;
        align-self: flex-start;
      }
    }

    /* Encabezado */
    .pn-hero {
      position: relative;
      overflow: hidden;
      color: #fff;
      padding: 38px 24px 50px;
      background:
        radial-gradient(
          circle at 88% 15%,
          rgba(242,194,48,.25),
          transparent 45%
        ),
        linear-gradient(
          135deg,
          var(--verde-900),
          var(--verde-700)
        );
    }

    .pn-hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6px;
      background: repeating-linear-gradient(
        90deg,
        var(--amarillo-500) 0 22px,
        var(--dorado-600) 22px 44px
      );
    }

    .pn-hero-caja {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      flex-wrap: wrap;
    }

    .pn-migas {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--amarillo-500);
      margin-bottom: 6px;
    }

    .pn-migas a {
      color: var(--amarillo-300);
    }

    .pn-migas a:hover {
      text-decoration: underline;
    }

    .pn-migas i {
      font-size: .65rem;
    }

    .pn-hero h1 {
      font-family: var(--f-hero);
      font-weight: 700;
      font-size: clamp(1.6rem, 3.4vw, 2.3rem);
      line-height: 1.15;
      color: #fff;
    }

    .pn-hero h1 em {
      color: var(--amarillo-500);
      font-style: normal;
    }

    .pn-hero p.pn-sub {
      margin-top: 8px;
      max-width: 560px;
      color: #e8f1e9;
    }

    .pn-rol {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      background: rgba(255,253,248,.1);
      border: 1px solid rgba(247,219,122,.4);
      border-radius: 6px 28px 6px 28px;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    .pn-rol i {
      font-size: 2rem;
      color: var(--amarillo-500);
    }

    .pn-rol strong {
      display: block;
      font-family: var(--f-display);
      font-size: 1.15rem;
      color: var(--amarillo-300);
      line-height: 1.1;
    }

    .pn-rol span {
      font-size: .78rem;
      color: #cfe3d3;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* Contenido */
    .pn-contenido {
      max-width: 1180px;
      margin: 0 auto;
      padding: 36px 24px 64px;
    }

    /* Buscador, año y contador */
    .pn-filtros {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 20px;
    }

    .pn-label {
      display: block;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--verde-900);
      margin-bottom: 6px;
    }

    :root[data-tema="noche"] .pn-label {
      color: var(--amarillo-300);
    }

    .pn-input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 4px 14px 4px 14px;
      border: 2px solid var(--borde);
      background: var(--blanco);
      color: var(--tinta);
      font-family: inherit;
      font-size: .95rem;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .pn-input:focus {
      outline: none;
      border-color: var(--amarillo-500);
      box-shadow: 0 0 0 4px rgba(242,194,48,.25);
    }

    .pn-buscar {
      position: relative;
    }

    .pn-buscar i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--verde-700);
      pointer-events: none;
    }

    .pn-buscar .pn-input {
      padding-left: 36px;
    }

    /* Contador */
    .pn-contador {
      font-weight: 700;
      font-size: .85rem;
      color: var(--verde-700);
      padding-bottom: 12px;
      white-space: nowrap;
    }

    :root[data-tema="noche"] .pn-contador {
      color: var(--amarillo-300);
    }

    /* Etiqueta única del año */
    .pn-anio {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 43px;
      padding: 10px 16px;
      border: 1px solid var(--borde);
      border-radius: 10px 18px 10px 18px;
      background: var(--verde-100);
      color: var(--verde-900);
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 3px 9px rgba(15,61,46,.06);
    }

    .pn-anio i {
      color: var(--verde-700);
    }

    :root[data-tema="noche"] .pn-anio {
      background: var(--verde-900);
      color: var(--amarillo-300);
    }

    /* Tabla */
    .pn-tabla-caja {
      background: var(--blanco);
      border: 1px solid var(--borde);
      border-radius: 6px 24px 6px 24px;
      box-shadow: 0 8px 20px rgba(15,61,46,.08);
      overflow-x: auto;
    }

    .pn-tabla {
      width: 100%;
      border-collapse: collapse;
    }

    .pn-tabla th {
      text-align: left;
      padding: 12px 14px;
      background: var(--verde-900);
      color: var(--amarillo-300);
      font-size: .8rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .pn-tabla td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--borde);
      color: var(--tinta);
      font-size: .9rem;
      vertical-align: middle;
    }

    .pn-tabla tbody tr:hover {
      background: var(--verde-100);
    }

    .pn-vacio {
      text-align: center;
      color: var(--tinta-suave);
      padding: 24px !important;
    }

    .pn-error {
      color: #c0392b;
      font-weight: 600;
    }

    /* Total de estudiantes */
    .pn-chips {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pn-chips li {
      background: var(--verde-100);
      color: var(--verde-900);
      border: 1px solid var(--borde);
      border-radius: 4px 12px 4px 12px;
      padding: 3px 10px;
      font-size: .78rem;
      font-weight: 600;
    }

    :root[data-tema="noche"] .pn-chips li {
      color: var(--amarillo-300);
    }

    /* Pie */
    .pn-pie {
      background: var(--verde-900);
      color: #9fbfa4;
      text-align: center;
      font-size: .85rem;
      padding: 16px 20px;
      border-top: 5px solid var(--amarillo-500);
    }

    /* Adaptación para celulares */
    @media (max-width: 860px) {
      .pn-filtros {
        grid-template-columns: 1fr auto;
      }

      .pn-buscar-caja {
        grid-column: 1 / -1;
      }

      .pn-contador {
        padding-bottom: 0;
      }

      .pn-anio {
        justify-self: start;
      }

      .pn-tabla {
        display: block;
      }

      .pn-tabla thead {
        display: none;
      }

      .pn-tabla tbody {
        display: block;
      }

      .pn-tabla tr {
        display: block;
        padding: 10px 14px;
        border-bottom: 6px solid var(--verde-100);
      }

      .pn-tabla td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        border: 0;
        padding: 6px 0;
        text-align: right;
        word-break: break-word;
      }

      .pn-tabla td::before {
        content: attr(data-label);
        font-weight: 700;
        font-size: .75rem;
        letter-spacing: .05em;
        text-transform: uppercase;
        color: var(--verde-700);
        text-align: left;
        flex-shrink: 0;
      }

      .pn-tabla td[colspan] {
        display: block;
        text-align: center;
      }

      .pn-tabla td[colspan]::before {
        content: none;
      }
    }

    @media (max-width: 600px) {
      .pn-hero {
        padding: 36px 24px 50px;
      }

      .pn-contenido {
        padding: 30px 16px 56px;
      }

      .pn-filtros {
        grid-template-columns: 1fr;
      }

      .pn-buscar-caja {
        grid-column: auto;
      }

      .pn-anio {
        justify-self: stretch;
      }
    }
  </style>
</head>

<body class="pn-body">

  <div id="barraProgreso" aria-hidden="true">
    <span id="barraProgresoRelleno"></span>
  </div>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="nav" id="nav">
    <div class="nav-inner">

      <a class="nav-marca" href="administrador.html">
        <img src="ESCUDOGGM.jpg" alt="Escudo del Colegio Gabriel García Márquez">
        <span>PISE-GGM<br>Panel</span>
      </a>

      <button
        class="nav-hamburguesa"
        id="navHamburguesa"
        aria-label="Abrir menú"
        aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-links" id="navLinks">

        <span class="pn-usuario">
          <i class="bi bi-person-circle"></i>
          <span id="nombreUsuario"></span>
        </span>

        <button
          id="btnModoNoche"
          class="btn-modo-noche"
          aria-label="Cambiar a modo noche"
          title="Cambiar tema">
          <i class="bi bi-moon-stars-fill"></i>
        </button>

        <a href="administrador.html" class="nav-volver">
          <i class="bi bi-arrow-left"></i>
          Volver al panel
        </a>

      </div>
    </div>
  </nav>

  <!-- ENCABEZADO -->
  <header class="pn-hero mini">
    <div class="pn-hero-caja">

      <div>
        <p class="pn-migas">
          <a href="administrador.html">Panel</a>
          <i class="bi bi-chevron-right"></i>
          Cursos
        </p>

        <h1>Reporte de <em>cursos</em></h1>

        <p class="pn-sub">
          Cursos del colegio y cantidad de estudiantes matriculados en cada uno
        </p>
      </div>

      <div class="pn-rol">
        <i class="bi bi-diagram-3-fill"></i>
        <div>
          <strong>Cursos</strong>
          <span>Consulta</span>
        </div>
      </div>

    </div>
  </header>

  <main class="pn-main">
    <div class="pn-contenido">

      <!-- BUSCADOR, AÑO Y CONTADOR -->
      <div class="pn-filtros">

        <div class="pn-buscar-caja">
          <label class="pn-label" for="buscador">Buscar</label>

          <div class="pn-buscar">
            <i class="bi bi-search"></i>
            <input
              type="text"
              id="buscador"
              class="pn-input"
              placeholder="Buscar por grado...">
          </div>
        </div>

        <!-- El año aparece una sola vez -->
        <div class="pn-anio" id="etiquetaAnio" aria-label="Año del reporte">
          <i class="bi bi-calendar3"></i>
          <span>Año 2026</span>
        </div>

        <span class="pn-contador" id="contador">0 registros</span>

      </div>

      <!-- TABLA SIN LA COLUMNA AÑO -->
      <div class="pn-tabla-caja">
        <table class="pn-tabla">

          <thead>
            <tr>
              <th>#</th>
              <th>Grado</th>
              <th>Estudiantes matriculados</th>
            </tr>
          </thead>

          <tbody id="cuerpoTabla">
            <tr>
              <td colspan="3" class="pn-vacio">Cargando...</td>
            </tr>
          </tbody>

        </table>
      </div>

    </div>
  </main>

  <footer class="pn-pie">
    <p>© 2026 Colegio Gabriel García Márquez. Todos los derechos reservados.</p>
  </footer>

  <button id="topBtn" aria-label="Subir al inicio">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="script.js"></script>

  <script>
    (function () {

      const API_BASE = "http://localhost:8081/api/reportes";

      // Validación de sesión: solo Administrador
      const token = localStorage.getItem("token");
      const usuarioRaw = localStorage.getItem("usuario");

      if (!token || !usuarioRaw) {
        window.location.href = "login.html";
        return;
      }

      let usuarioSesion;

      try {
        usuarioSesion = JSON.parse(usuarioRaw);
      } catch (e) {
        window.location.href = "login.html";
        return;
      }

      const rolSesion = (
        (usuarioSesion.rol && usuarioSesion.rol.nombreRol) || ""
      ).trim();

      if (rolSesion.toUpperCase() !== "ADMINISTRADOR") {
        window.location.href = "login.html";
        return;
      }

      // Mostrar nombre del usuario
      document.getElementById("nombreUsuario").textContent =
        (usuarioSesion.nombre || "") + " " +
        (usuarioSesion.apellido || "");

      let cursos = [];

      // Cargar cursos desde el backend
      async function cargarCursos() {
        mostrarCargando();

        try {
          const respuesta = await fetch(API_BASE + "/cursos", {
            headers: {
              "Authorization": "Bearer " + token
            }
          });

          if (!respuesta.ok) {
            throw new Error(
              "El servidor respondió con estado " + respuesta.status
            );
          }

          cursos = await respuesta.json();

          // Actualizar la etiqueta si la API devuelve un único año
          const anios = [
            ...new Set(
              cursos
                .map(c => c.anio)
                .filter(a => a !== null && a !== undefined && a !== "")
            )
          ];

          if (anios.length === 1) {
            document.querySelector("#etiquetaAnio span").textContent =
              "Año " + anios[0];
          } else {
            document.querySelector("#etiquetaAnio span").textContent =
              "Año 2026";
          }

          pintarTabla();

        } catch (error) {
          console.error(error);

          mostrarError(
            "No se pudo conectar con el servidor. " +
            "Verifica que el backend esté encendido."
          );
        }
      }

      // Dibujar tabla y aplicar búsqueda
      function pintarTabla() {

        const texto = document
          .getElementById("buscador")
          .value
          .trim()
          .toLowerCase();

        const filtrados = cursos.filter(function (c) {
          if (texto === "") return true;

          const grado = String(c.grado || "").toLowerCase();

          return grado.includes(texto);
        });

        const cuerpo = document.getElementById("cuerpoTabla");

        document.getElementById("contador").textContent =
          filtrados.length + " registros";

        if (filtrados.length === 0) {
          cuerpo.innerHTML =
            '<tr><td colspan="3" class="pn-vacio">' +
            'Sin resultados</td></tr>';
          return;
        }

        cuerpo.innerHTML = filtrados
          .slice()
          .sort(function (a, b) {
            return String(a.grado || "").localeCompare(
              String(b.grado || ""),
              "es",
              { numeric: true }
            );
          })
          .map(function (c, indice) {

            return "<tr>" +

              '<td data-label="#">' +
                (indice + 1) +
              "</td>" +

              '<td data-label="Grado">' +
                limpiar(c.grado) +
              "</td>" +

              '<td data-label="Estudiantes matriculados">' +
                '<ul class="pn-chips"><li>' +
                  limpiar(
                    c.totalEstudiantes === 0
                      ? "0"
                      : c.totalEstudiantes
                  ) +
                "</li></ul>" +
              "</td>" +

            "</tr>";

          }).join("");
      }

      // Estado de carga
      function mostrarCargando() {
        document.getElementById("cuerpoTabla").innerHTML =
          '<tr><td colspan="3" class="pn-vacio">' +
          'Cargando...</td></tr>';
      }

      // Mostrar errores
      function mostrarError(mensaje) {
        document.getElementById("cuerpoTabla").innerHTML =
          '<tr><td colspan="3" class="pn-vacio pn-error">' +
          limpiar(mensaje) +
          "</td></tr>";

        document.getElementById("contador").textContent =
          "0 registros";
      }

      // Evitar que los datos recibidos inserten HTML
      function limpiar(valor) {
        if (
          valor === null ||
          valor === undefined ||
          valor === ""
        ) {
          return "—";
        }

        return String(valor)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // Buscar mientras se escribe
      document
        .getElementById("buscador")
        .addEventListener("input", pintarTabla);

      // Iniciar reporte
      cargarCursos();

    })();
  </script>

</body>
</html>
