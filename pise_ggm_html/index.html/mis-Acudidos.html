<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Acudidos | PISE-GGM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
  body.pn-body { background: var(--blanco); min-height: 100vh; display: flex; flex-direction: column; }
  .pn-main { flex: 1; }
  .oculto { display: none !important; }

  /* ---------- Barra superior ---------- */
  .pn-usuario {
    display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: .92rem; color: var(--verde-900);
    background: var(--verde-100); border: 1px solid var(--borde); padding: 7px 14px; border-radius: 4px 14px 4px 14px;
  }
  .pn-usuario i { color: var(--dorado-600); }
  :root[data-tema="noche"] .pn-usuario { color: var(--amarillo-300); }

  .nav-links a.nav-volver, .nav-links a.nav-volver:link, .nav-links a.nav-volver:visited {
    display: inline-flex; align-items: center; gap: 8px; font-size: .92rem; font-weight: 700;
    background: var(--verde-700); color: #FFFFFF !important; padding: .6rem 1.2rem; border-radius: 30px; margin-left: 8px;
    text-decoration: none; transition: background .2s ease, transform .15s ease;
  }
  .nav-links a.nav-volver i { color: #FFFFFF !important; }
  .nav-links a.nav-volver:hover { background: var(--verde-900); transform: translateY(-1px); }

  .pn-salir {
    display: inline-flex; align-items: center; gap: 8px; font-size: .92rem; font-weight: 700; font-family: inherit;
    background: transparent; color: #c0392b; border: 2px solid #c0392b; padding: .5rem 1.1rem; border-radius: 30px;
    margin-left: 8px; cursor: pointer; transition: background .2s ease, color .2s ease;
  }
  .pn-salir:hover { background: #c0392b; color: #fff; }
  @media (max-width: 880px) {
    .nav-links a.nav-volver, .nav-links .pn-salir { margin: 10px 4px 0; align-self: flex-start; }
    .nav-links .pn-usuario { margin: 6px 4px 0; align-self: flex-start; }
  }

  /* ---------- Encabezado ---------- */
  .pn-hero {
    position: relative; overflow: hidden; color: #fff; padding: 38px 24px 50px;
    background: radial-gradient(circle at 88% 15%, rgba(242,194,48,.25), transparent 45%),
                linear-gradient(135deg, var(--verde-900), var(--verde-700));
  }
  .pn-hero::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: repeating-linear-gradient(90deg, var(--amarillo-500) 0 22px, var(--dorado-600) 22px 44px);
  }
  .pn-hero-caja { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .pn-migas { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--amarillo-500); margin: 0 0 6px; }
  .pn-migas a { color: var(--amarillo-300); text-decoration: none; }
  .pn-migas a:hover { text-decoration: underline; }
  .pn-migas i { font-size: .65rem; }
  .pn-hero h1 { font-family: var(--f-hero); font-weight: 700; font-size: clamp(1.6rem, 3.4vw, 2.3rem); line-height: 1.15; color: #fff; margin: 0; }
  .pn-hero h1 em { color: var(--amarillo-500); font-style: normal; }
  .pn-hero p.pn-sub { margin: 8px 0 0; max-width: 560px; color: #e8f1e9; }
  .pn-rol {
    display: inline-flex; align-items: center; gap: 14px; padding: 16px 22px; background: rgba(255,253,248,.1);
    border: 1px solid rgba(247,219,122,.4); border-radius: 6px 28px 6px 28px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .pn-rol i { font-size: 2rem; color: var(--amarillo-500); }
  .pn-rol strong { display: block; font-family: var(--f-display); font-size: 1.15rem; color: var(--amarillo-300); line-height: 1.1; }
  .pn-rol span { font-size: .78rem; color: #cfe3d3; letter-spacing: .08em; text-transform: uppercase; }

  /* ---------- Contenido ---------- */
  .pn-contenido { max-width: 1180px; margin: 0 auto; padding: 36px 24px 64px; width: 100%; box-sizing: border-box; }

  .pn-alerta { margin-bottom: 18px; padding: 12px 16px; border-radius: 4px 16px 4px 16px; font-weight: 600; font-size: .92rem; background: #fdecea; color: #a02e22; border: 1px solid #f0b8b2; }

  .pn-filtros { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; margin-bottom: 20px; }
  .pn-label { display: block; font-size: .78rem; font-weight: 700; letter-spacing: .04em; color: var(--verde-900); margin-bottom: 6px; }
  :root[data-tema="noche"] .pn-label { color: var(--amarillo-300); }
  .pn-input {
    width: 100%; padding: 11px 12px; border-radius: 4px 14px 4px 14px; border: 2px solid var(--borde);
    background: var(--blanco); color: var(--tinta); font-family: inherit; font-size: .95rem; box-sizing: border-box;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .pn-input:focus { outline: none; border-color: var(--amarillo-500); box-shadow: 0 0 0 4px rgba(242,194,48,.25); }
  .pn-buscar { position: relative; }
  .pn-buscar i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--verde-700); pointer-events: none; }
  .pn-buscar .pn-input { padding-left: 36px; }
  .pn-contador { font-weight: 700; font-size: .85rem; color: var(--verde-700); padding-bottom: 12px; white-space: nowrap; }
  :root[data-tema="noche"] .pn-contador { color: var(--amarillo-300); }

  /* ---------- Tabla ---------- */
  .pn-tabla-caja { background: var(--blanco); border: 1px solid var(--borde); border-radius: 6px 24px 6px 24px; box-shadow: 0 8px 20px rgba(15,61,46,.08); overflow-x: auto; }
  .pn-tabla { width: 100%; border-collapse: collapse; }
  .pn-tabla th { text-align: left; padding: 12px 14px; background: var(--verde-900); color: var(--amarillo-300); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .pn-tabla td { padding: 10px 14px; border-bottom: 1px solid var(--borde); color: var(--tinta); font-size: .9rem; vertical-align: middle; }
  .pn-tabla tbody tr:hover { background: var(--verde-100); }
  .pn-vacio { text-align: center; color: var(--tinta-suave); padding: 24px !important; }
  .pn-error { color: #c0392b; font-weight: 600; }

  .pn-chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .pn-chips li { background: var(--verde-100); color: var(--verde-900); border: 1px solid var(--borde); border-radius: 4px 12px 4px 12px; padding: 3px 10px; font-size: .78rem; font-weight: 600; }
  :root[data-tema="noche"] .pn-chips li { color: var(--amarillo-300); }

  .pn-btn-notas, .pn-btn-notas:link, .pn-btn-notas:visited {
    display: inline-flex; align-items: center; gap: 6px; background: var(--verde-700); color: #fff !important;
    font-size: .8rem; font-weight: 700; padding: 6px 14px; border-radius: 30px; text-decoration: none;
  }
  .pn-btn-notas:hover { background: var(--verde-900); }

  .pn-pie { background: var(--verde-900); color: #9fbfa4; text-align: center; font-size: .85rem; padding: 16px 20px; border-top: 5px solid var(--amarillo-500); }
  .pn-pie p { margin: 0; }

  /* ---------- Celular: cada fila se vuelve una tarjeta ---------- */
  @media (max-width: 860px) {
    .pn-filtros { grid-template-columns: 1fr; }
    .pn-contador { padding-bottom: 0; }
    .pn-tabla, .pn-tabla tbody { display: block; }
    .pn-tabla thead { display: none; }
    .pn-tabla tr { display: block; padding: 10px 14px; border-bottom: 6px solid var(--verde-100); }
    .pn-tabla td { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; padding: 6px 0; text-align: right; word-break: break-word; }
    .pn-tabla td::before { content: attr(data-label); font-weight: 700; font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--verde-700); text-align: left; flex-shrink: 0; }
    .pn-tabla td[colspan] { display: block; text-align: center; }
    .pn-tabla td[colspan]::before { content: none; }
  }
  @media (max-width: 600px) {
    .pn-hero { padding: 30px 20px 42px; }
    .pn-contenido { padding: 28px 16px 56px; }
  }
  </style>
</head>
<body class="pn-body">

  <div id="barraProgreso" aria-hidden="true"><span id="barraProgresoRelleno"></span></div>

  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a class="nav-marca" href="acudiente.html">
        <img src="ESCUDOGGM.jpg" alt="Escudo del Colegio Gabriel García Márquez">
        <span>PISE-GGM<br>Acudiente</span>
      </a>
      <button class="nav-hamburguesa" id="navHamburguesa" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="navLinks">
        <span class="pn-usuario"><i class="bi bi-person-circle"></i><span id="nombreUsuario"></span></span>
        <button id="btnModoNoche" class="btn-modo-noche" aria-label="Cambiar a modo noche" title="Cambiar tema">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <a href="acudiente.html" class="nav-volver"><i class="bi bi-arrow-left"></i> Volver al panel</a>
        <button class="pn-salir" id="btnCerrarSesion"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <header class="pn-hero">
    <div class="pn-hero-caja">
      <div>
        <p class="pn-migas"><a href="acudiente.html">Panel</a> <i class="bi bi-chevron-right"></i> Mis acudidos</p>
        <h1>Mis <em>acudidos</em></h1>
        <p class="pn-sub">Estudiantes a tu cargo — Colegio Gabriel García Márquez</p>
      </div>
      <div class="pn-rol">
        <i class="bi bi-people-fill"></i>
        <div><strong>Acudidos</strong><span>Consulta</span></div>
      </div>
    </div>
  </header>

  <main class="pn-main">
    <div class="pn-contenido">

      <div id="aviso" class="pn-alerta oculto" role="alert"></div>

      <div class="pn-filtros">
        <div>
          <label class="pn-label" for="buscador">Buscar</label>
          <div class="pn-buscar">
            <i class="bi bi-search"></i>
            <input type="text" id="buscador" class="pn-input" placeholder="Nombre, documento o curso...">
          </div>
        </div>
        <span class="pn-contador" id="contador">0 registros</span>
      </div>

      <div class="pn-tabla-caja">
        <table class="pn-tabla">
          <thead>
            <tr>
              <th>#</th>
              <th>Estudiante</th>
              <th>Documento</th>
              <th>Curso</th>
              <th>Notas</th>
            </tr>
          </thead>
          <tbody id="tbAcudidos">
            <tr><td colspan="5" class="pn-vacio">Cargando...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <footer class="pn-pie">
    <p>© 2026 Colegio Gabriel García Márquez. Todos los derechos reservados.</p>
  </footer>

  <button id="topBtn" aria-label="Subir al inicio"><i class="bi bi-arrow-up"></i></button>

  <script src="script.js"></script>
  <script>
  (function () {

    // GET /api/acudiente/{idUsuario}/acudidos
    // Respuesta por estudiante: { idEstudiante, nombre, apellido, documento, curso }
    const API = "http://localhost:8081/api/acudiente";

    // ---- Guardia de sesión: solo Acudiente ----
    const token = localStorage.getItem("token");
    const usuarioRaw = localStorage.getItem("usuario");
    if (!token || !usuarioRaw) { window.location.href = "login.html"; return; }

    let usuario;
    try { usuario = JSON.parse(usuarioRaw); } catch (e) { window.location.href = "login.html"; return; }

    const rol = String((usuario.rol && usuario.rol.nombreRol) || usuario.rol || "").trim();
    if (rol.toUpperCase() !== "ACUDIENTE") { window.location.href = "login.html"; return; }

    document.getElementById("nombreUsuario").textContent = usuario.nombre + " " + (usuario.apellido || "");

    document.getElementById("btnCerrarSesion").addEventListener("click", function () {
      localStorage.removeItem("token");
      localStorage.removeItem("usuario");
      localStorage.removeItem("idPerfil");
      window.location.href = "login.html";
    });

    const BASE = API + "/" + usuario.idUsuario;
    let acudidos = [];

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function v(x) { return x === null || x === undefined || x === "" ? "—" : esc(x); }
    function documentoDe(e) { return e.documento || e.numeroDocumento || ""; }

    function avisar(msg) {
      const a = document.getElementById("aviso");
      a.textContent = msg;
      a.classList.remove("oculto");
    }

    function pintar() {
      const texto = document.getElementById("buscador").value.trim().toLowerCase();
      const filtrados = acudidos.filter(function (e) {
        if (!texto) return true;
        return [e.nombre, e.apellido, documentoDe(e), e.curso]
          .map(function (x) { return String(x || "").toLowerCase(); })
          .some(function (c) { return c.includes(texto); });
      });

      document.getElementById("contador").textContent = filtrados.length + " registros";
      const tb = document.getElementById("tbAcudidos");

      if (filtrados.length === 0) {
        tb.innerHTML = '<tr><td colspan="5" class="pn-vacio">No tienes estudiantes a cargo registrados.</td></tr>';
        return;
      }

      tb.innerHTML = filtrados.map(function (e, i) {
        return "<tr>" +
          '<td data-label="#">' + (i + 1) + "</td>" +
          '<td data-label="Estudiante">' + esc(((e.nombre || "") + " " + (e.apellido || "")).trim() || "—") + "</td>" +
          '<td data-label="Documento">' + v(documentoDe(e)) + "</td>" +
          '<td data-label="Curso">' + (e.curso ? '<ul class="pn-chips"><li>' + esc(e.curso) + "</li></ul>" : "—") + "</td>" +
          '<td data-label="Notas"><a class="pn-btn-notas" href="notas-acudidos.html?est=' +
            encodeURIComponent(e.idEstudiante) + '"><i class="bi bi-clipboard-data-fill"></i> Ver notas</a></td>' +
          "</tr>";
      }).join("");
    }

    async function cargar() {
      const tb = document.getElementById("tbAcudidos");
      try {
        const r = await fetch(BASE + "/acudidos", {
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }
        });
        if (!r.ok) throw new Error("Error " + r.status + " al consultar tus acudidos.");
        const lista = await r.json();
        acudidos = Array.isArray(lista) ? lista : [];
        pintar();
      } catch (e) {
        console.error(e);
        tb.innerHTML = '<tr><td colspan="5" class="pn-vacio pn-error">No se pudo cargar la información.</td></tr>';
        document.getElementById("contador").textContent = "0 registros";
        avisar(e.message);
      }
    }

    document.getElementById("buscador").addEventListener("input", pintar);
    cargar();

  })();
  </script>
</body>
</html>
