<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de Acudientes | PISE-GGM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    .cabecera {
      background: linear-gradient(135deg, #198754, #14532d);
      color: #fff;
      border-radius: 14px;
      padding: 24px 32px;
      margin-bottom: 24px;
    }
    .tabla-reporte th {
      background: #198754;
      color: #fff;
      font-size: .9rem;
    }
    .tabla-reporte td {
      font-size: .9rem;
      vertical-align: middle;
    }
    .lista-chip {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .lista-chip li {
      display: inline-block;
      background: #e9f7ef;
      color: #14532d;
      border-radius: 8px;
      padding: 2px 8px;
      margin: 2px;
      font-size: .78rem;
    }
  </style>
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-success" href="administrador.html">PISE-GGM</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span id="nombreUsuario" class="fw-semibold"></span>
        <a href="administrador.html" class="btn btn-outline-success btn-sm">
          <i class="bi bi-arrow-left"></i> Volver al panel
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <div class="cabecera">
      <h1 class="h4 mb-1">Reporte de Acudientes</h1>
      <p class="mb-0 small">Acudientes registrados y los estudiantes a su cargo</p>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-8">
        <label class="form-label small fw-semibold">Buscar</label>
        <input type="text" id="buscador" class="form-control"
               placeholder="Nombre, apellido, documento o parentesco...">
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <span class="badge bg-secondary fs-6" id="contador">0 registros</span>
      </div>
    </div>

    <div class="table-responsive bg-white rounded shadow-sm">
      <table class="table table-striped table-hover mb-0 tabla-reporte">
        <thead>
          <tr>
            <th>#</th>
            <th>Documento</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Parentesco</th>
            <th>Estudiantes a cargo</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla">
          <tr><td colspan="8" class="text-center text-muted py-4">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>

    const API_BASE = "http://localhost:8082/api/reportes";

    const token = localStorage.getItem("token");
    const usuarioRaw = localStorage.getItem("usuario");

    if (!token || !usuarioRaw) {
      window.location.href = "login.html";
    }

    const usuarioSesion = JSON.parse(usuarioRaw);
    const rolSesion = ((usuarioSesion.rol && usuarioSesion.rol.nombreRol) || "").trim();

    if (rolSesion.toUpperCase() !== "ADMINISTRADOR") {
      window.location.href = "login.html";
    }

    document.getElementById("nombreUsuario").textContent =
      usuarioSesion.nombre + " " + usuarioSesion.apellido;

    let acudientes = [];

    async function cargarAcudientes() {
      mostrarCargando();
      try {
        const respuesta = await fetch(API_BASE + "/acudientes");
        if (!respuesta.ok) throw new Error("El servidor respondió con error");
        acudientes = await respuesta.json();
        pintarTabla();
      } catch (error) {
        console.error(error);
        mostrarError("No se pudo conectar con el servidor. Verifica que el backend esté encendido.");
      }
    }

    function pintarTabla() {

      const texto = document.getElementById("buscador").value.trim().toLowerCase();

      const filtrados = acudientes.filter(function (a) {
        if (texto === "") return true;
        const campos = [a.nombre, a.apellido, a.numeroDocumento, a.parentesco]
          .map(function (v) { return (v || "").toLowerCase(); });
        return campos.some(function (c) { return c.includes(texto); });
      });

      const cuerpo = document.getElementById("cuerpoTabla");
      document.getElementById("contador").textContent = filtrados.length + " registros";

      if (filtrados.length === 0) {
        cuerpo.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Sin resultados</td></tr>';
        return;
      }

      cuerpo.innerHTML = filtrados.map(function (a, indice) {
        return "<tr>" +
          "<td>" + (indice + 1) + "</td>" +
          "<td>" + limpiar(a.numeroDocumento) + "</td>" +
          "<td>" + limpiar(a.nombre) + "</td>" +
          "<td>" + limpiar(a.apellido) + "</td>" +
          "<td>" + limpiar(a.telefono) + "</td>" +
          "<td>" + limpiar(a.email) + "</td>" +
          "<td>" + limpiar(a.parentesco) + "</td>" +
          "<td>" + listaChips(a.estudiantesACargo) + "</td>" +
          "</tr>";
      }).join("");
    }

    function listaChips(arreglo) {
      if (!arreglo || arreglo.length === 0) return "—";
      return '<ul class="lista-chip">' +
        arreglo.map(function (item) { return "<li>" + limpiar(item) + "</li>"; }).join("") +
        "</ul>";
    }

    function mostrarCargando() {
      document.getElementById("cuerpoTabla").innerHTML =
        '<tr><td colspan="8" class="text-center text-muted py-4">Cargando...</td></tr>';
    }

    function mostrarError(mensaje) {
      document.getElementById("cuerpoTabla").innerHTML =
        '<tr><td colspan="8" class="text-center text-danger py-4">' + mensaje + "</td></tr>";
      document.getElementById("contador").textContent = "0 registros";
    }

    function limpiar(valor) {
      if (valor === null || valor === undefined || valor === "") return "—";
      return String(valor).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById("buscador").addEventListener("input", pintarTabla);

    cargarAcudientes();

  </script>

</body>
</html>
