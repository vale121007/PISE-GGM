<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil | PISE-GGM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
  body.pn-body { background: var(--blanco); min-height: 100vh; display: flex; flex-direction: column; }
  .pn-main { flex: 1; }
  [hidden] { display: none !important; }

  /* ---------- Barra superior ---------- */
  .pn-usuario {
    display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: .92rem; color: var(--verde-900);
    background: var(--verde-100); border: 1px solid var(--borde); padding: 7px 14px; border-radius: 4px 14px 4px 14px;
  }
  .pn-usuario i { color: var(--dorado-600); }
  :root[data-tema="noche"] .pn-usuario { color: var(--amarillo-300); }

  .nav-links a.nav-volver, .nav-links a.nav-volver:link, .nav-links a.nav-volver:visited {
    display: inline-flex; align-items: center; gap: 8px; font-size: .92rem; font-weight: 700;
    background: var(--verde-700); color: #FFFFFF !important; padding: .6rem 1.2rem; border-radius: 30px; margin-left: 8px;
    text-decoration: none; transition: background .2s ease, transform .15s ease;
  }
  .nav-links a.nav-volver i { color: #FFFFFF !important; }
  .nav-links a.nav-volver:hover { background: var(--verde-900); transform: translateY(-1px); }

  .pn-salir {
    display: inline-flex; align-items: center; gap: 8px; font-size: .92rem; font-weight: 700; font-family: inherit;
    background: transparent; color: #c0392b; border: 2px solid #c0392b; padding: .5rem 1.1rem; border-radius: 30px;
    margin-left: 8px; cursor: pointer; transition: background .2s ease, color .2s ease;
  }
  .pn-salir:hover { background: #c0392b; color: #fff; }
  @media (max-width: 880px) {
    .nav-links a.nav-volver, .nav-links .pn-salir { margin: 10px 4px 0; align-self: flex-start; }
    .nav-links .pn-usuario { margin: 6px 4px 0; align-self: flex-start; }
  }

  /* ---------- Encabezado ---------- */
  .pn-hero {
    position: relative; overflow: hidden; color: #fff; padding: 38px 24px 50px;
    background: radial-gradient(circle at 88% 15%, rgba(242,194,48,.25), transparent 45%),
                linear-gradient(135deg, var(--verde-900), var(--verde-700));
  }
  .pn-hero::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: repeating-linear-gradient(90deg, var(--amarillo-500) 0 22px, var(--dorado-600) 22px 44px);
  }
  .pn-hero-caja { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .pn-migas { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--amarillo-500); margin: 0 0 6px; }
  .pn-migas a { color: var(--amarillo-300); text-decoration: none; }
  .pn-migas a:hover { text-decoration: underline; }
  .pn-migas i { font-size: .65rem; }
  .pn-hero h1 { font-family: var(--f-hero); font-weight: 700; font-size: clamp(1.6rem, 3.4vw, 2.3rem); line-height: 1.15; color: #fff; margin: 0; }
  .pn-hero h1 em { color: var(--amarillo-500); font-style: normal; }
  .pn-hero p.pn-sub { margin: 8px 0 0; max-width: 560px; color: #e8f1e9; }
  .pn-rol {
    display: inline-flex; align-items: center; gap: 14px; padding: 16px 22px; background: rgba(255,253,248,.1);
    border: 1px solid rgba(247,219,122,.4); border-radius: 6px 28px 6px 28px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .pn-rol i { font-size: 2rem; color: var(--amarillo-500); }
  .pn-rol strong { display: block; font-family: var(--f-display); font-size: 1.15rem; color: var(--amarillo-300); line-height: 1.1; }
  .pn-rol span { font-size: .78rem; color: #cfe3d3; letter-spacing: .08em; text-transform: uppercase; }

  /* ---------- Contenido ---------- */
  .pn-contenido { max-width: 1180px; margin: 0 auto; padding: 36px 24px 64px; width: 100%; box-sizing: border-box; }
  .pn-caja { background: var(--blanco); border: 1px solid var(--borde); border-radius: 6px 24px 6px 24px; box-shadow: 0 8px 20px rgba(15,61,46,.08); padding: 26px; }

  .pn-perfil-cab { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--borde); flex-wrap: wrap; }
  .pn-avatar-caja { position: relative; flex-shrink: 0; }
  .pn-avatar {
    width: 96px; height: 96px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--verde-900), var(--verde-700)); color: var(--amarillo-300);
    font-family: var(--f-display); font-size: 2rem; font-weight: 700; border: 3px solid var(--amarillo-500);
  }
  .pn-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pn-foto-btn {
    position: absolute; right: -2px; bottom: -2px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff;
    background: var(--verde-700); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .pn-foto-btn:hover { background: var(--verde-900); }
  .pn-perfil-cab h2 { font-family: var(--f-display); font-size: 1.4rem; color: var(--verde-900); margin: 0; }
  :root[data-tema="noche"] .pn-perfil-cab h2 { color: var(--amarillo-300); }
  .pn-etiqueta { display: inline-block; margin-top: 4px; background: var(--amarillo-500); color: var(--verde-900); border-radius: 12px; padding: 2px 12px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .pn-foto-acciones { margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; }
  .pn-link { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--verde-700); cursor: pointer; text-decoration: underline; }
  .pn-link.rojo { color: #c0392b; }
  .pn-foto-msg { font-size: .8rem; margin-top: 6px; color: #c0392b; min-height: 1em; }

  .pn-datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .pn-dato { background: var(--verde-100); border: 1px solid var(--borde); border-radius: 4px 16px 4px 16px; padding: 14px 16px; }
  .pn-dato-label { display: flex; align-items: center; gap: 8px; font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--verde-700); margin-bottom: 4px; }
  .pn-dato-label i { color: var(--dorado-600); }
  .pn-dato-valor { font-weight: 700; color: var(--tinta); word-break: break-word; }
  .pn-dato-valor.vacio { font-weight: 400; color: var(--tinta-suave); }
  :root[data-tema="noche"] .pn-dato-label { color: var(--amarillo-300); }

  .pn-pie { background: var(--verde-900); color: #9fbfa4; text-align: center; font-size: .85rem; padding: 16px 20px; border-top: 5px solid var(--amarillo-500); }
  .pn-pie p { margin: 0; }
  @media (max-width: 600px) {
    .pn-hero { padding: 30px 20px 42px; }
    .pn-contenido { padding: 28px 16px 56px; }
    .pn-caja { padding: 18px; }
  }
  </style>
</head>
<body class="pn-body">

  <div id="barraProgreso" aria-hidden="true"><span id="barraProgresoRelleno"></span></div>

  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a class="nav-marca" href="acudiente.html">
        <img src="ESCUDOGGM.jpg" alt="Escudo del Colegio Gabriel García Márquez">
        <span>PISE-GGM<br>Acudiente</span>
      </a>
      <button class="nav-hamburguesa" id="navHamburguesa" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="navLinks">
        <span class="pn-usuario"><i class="bi bi-person-circle"></i><span id="nombreUsuario"></span></span>
        <button id="btnModoNoche" class="btn-modo-noche" aria-label="Cambiar a modo noche" title="Cambiar tema">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <a href="acudiente.html" class="nav-volver"><i class="bi bi-arrow-left"></i> Volver al panel</a>
        <button class="pn-salir" id="btnCerrarSesion"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <header class="pn-hero">
    <div class="pn-hero-caja">
      <div>
        <p class="pn-migas"><a href="acudiente.html">Panel</a> <i class="bi bi-chevron-right"></i> Mi perfil</p>
        <h1>Mi <em>perfil</em></h1>
        <p class="pn-sub">Tus datos personales — Colegio Gabriel García Márquez</p>
      </div>
      <div class="pn-rol">
        <i class="bi bi-person-badge-fill"></i>
        <div><strong>Acudiente</strong><span>Datos personales</span></div>
      </div>
    </div>
  </header>

  <main class="pn-main">
    <div class="pn-contenido">
      <div class="pn-caja">
        <div class="pn-perfil-cab">
          <div class="pn-avatar-caja">
            <div class="pn-avatar">
              <span id="iniciales">--</span>
              <img id="fotoImg" alt="Foto de perfil" hidden>
            </div>
            <button type="button" class="pn-foto-btn" id="btnFoto" title="Cambiar foto" aria-label="Cambiar foto">
              <i class="bi bi-camera-fill"></i>
            </button>
            <input type="file" id="inputFoto" accept="image/*" hidden>
          </div>
          <div>
            <h2 id="perfilNombreCompleto">—</h2>
            <span class="pn-etiqueta">Acudiente</span>
            <div class="pn-foto-acciones">
              <button type="button" class="pn-link" id="btnCambiar">Cambiar foto</button>
              <button type="button" class="pn-link rojo" id="btnQuitar" hidden>Quitar foto</button>
            </div>
            <div class="pn-foto-msg" id="fotoMsg"></div>
          </div>
        </div>

        <div class="pn-datos" id="perfilDatos"></div>
      </div>
    </div>
  </main>

  <footer class="pn-pie">
    <p>© 2026 Colegio Gabriel García Márquez. Todos los derechos reservados.</p>
  </footer>

  <button id="topBtn" aria-label="Subir al inicio"><i class="bi bi-arrow-up"></i></button>

  <script src="script.js"></script>
  <script>
  (function () {

    // Opcional: GET /api/acudiente/{idUsuario}/perfil (si no existe, se usan los datos del login)
    const API = "http://localhost:8081/api/acudiente";

    // ---- Guardia de sesión: solo Acudiente ----
    const token = localStorage.getItem("token");
    const usuarioRaw = localStorage.getItem("usuario");
    if (!token || !usuarioRaw) { window.location.href = "login.html"; return; }

    let usuario;
    try { usuario = JSON.parse(usuarioRaw); } catch (e) { window.location.href = "login.html"; return; }

    const rol = String((usuario.rol && usuario.rol.nombreRol) || usuario.rol || "").trim();
    if (rol.toUpperCase() !== "ACUDIENTE") { window.location.href = "login.html"; return; }

    document.getElementById("nombreUsuario").textContent = usuario.nombre + " " + (usuario.apellido || "");

    document.getElementById("btnCerrarSesion").addEventListener("click", function () {
      localStorage.removeItem("token");
      localStorage.removeItem("usuario");
      localStorage.removeItem("idPerfil");
      window.location.href = "login.html";
    });

    const idUsuario = usuario.idUsuario !== undefined ? usuario.idUsuario : (usuario.id || "x");
    const CLAVE_FOTO = "fotoPerfil_" + idUsuario;

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    // ---------- Datos ----------
    function pintarDato(icono, etiqueta, valor) {
      return '<div class="pn-dato">' +
        '<div class="pn-dato-label"><i class="bi ' + icono + '"></i>' + esc(etiqueta) + "</div>" +
        (valor
          ? '<div class="pn-dato-valor">' + esc(valor) + "</div>"
          : '<div class="pn-dato-valor vacio">No registrado</div>') +
        "</div>";
    }

    function pintarPerfil(d) {
      const nombreCompleto = ((d.nombre || "") + " " + (d.apellido || "")).trim();
      const iniciales = ((d.nombre || "")[0] || "") + ((d.apellido || "")[0] || "");
      // El backend usa "numeroDocumento"; se aceptan otros nombres por si acaso
      const numero = d.numeroDocumento || d.documento || d.numDocumento || d.cedula || "";
      const documento = [d.tipoDocumento, numero].filter(Boolean).join(" ");

      document.getElementById("perfilNombreCompleto").textContent = nombreCompleto || "—";
      document.getElementById("iniciales").textContent = iniciales.toUpperCase() || "--";

      document.getElementById("perfilDatos").innerHTML = [
        pintarDato("bi-person-fill", "Nombre completo", nombreCompleto),
        pintarDato("bi-card-text", "Documento", documento),
        pintarDato("bi-envelope-fill", "Correo electrónico", d.correo || d.email),
        pintarDato("bi-telephone-fill", "Teléfono", d.telefono)
      ].join("");
    }

    async function cargarPerfil() {
      console.log("Datos del usuario guardados en el login:", usuario);
      pintarPerfil(usuario);
      try {
        const r = await fetch(API + "/" + idUsuario + "/perfil", {
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }
        });
        if (r.ok) pintarPerfil(Object.assign({}, usuario, await r.json()));
      } catch (e) { /* el endpoint es opcional */ }
    }

    // ---------- Foto ----------
    const img = document.getElementById("fotoImg");
    const iniciales = document.getElementById("iniciales");
    const input = document.getElementById("inputFoto");
    const btnQuitar = document.getElementById("btnQuitar");
    const msg = document.getElementById("fotoMsg");

    function mostrarFoto(src) {
      if (src) {
        img.src = src; img.hidden = false; iniciales.hidden = true; btnQuitar.hidden = false;
      } else {
        img.removeAttribute("src"); img.hidden = true; iniciales.hidden = false; btnQuitar.hidden = true;
      }
    }

    // Reduce la imagen a 320 px para que ocupe poco espacio
    function reducir(file, max) {
      return new Promise(function (resolve, reject) {
        const lector = new FileReader();
        lector.onerror = function () { reject(new Error("No se pudo leer la imagen.")); };
        lector.onload = function () {
          const im = new Image();
          im.onerror = function () { reject(new Error("El archivo no es una imagen válida.")); };
          im.onload = function () {
            const escala = Math.min(1, max / Math.max(im.width, im.height));
            const c = document.createElement("canvas");
            c.width = Math.round(im.width * escala);
            c.height = Math.round(im.height * escala);
            c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
            resolve(c.toDataURL("image/jpeg", 0.85));
          };
          im.src = lector.result;
        };
        lector.readAsDataURL(file);
      });
    }

    function abrirSelector() { input.click(); }
    document.getElementById("btnFoto").addEventListener("click", abrirSelector);
    document.getElementById("btnCambiar").addEventListener("click", abrirSelector);

    input.addEventListener("change", async function () {
      msg.textContent = "";
      const archivo = input.files && input.files[0];
      if (!archivo) return;
      if (!/^image\//.test(archivo.type)) { msg.textContent = "Elige un archivo de imagen."; return; }
      try {
        const dataUrl = await reducir(archivo, 320);
        localStorage.setItem(CLAVE_FOTO, dataUrl);
        mostrarFoto(dataUrl);
      } catch (e) {
        msg.textContent = e.message || "No se pudo guardar la foto.";
      }
      input.value = "";
    });

    btnQuitar.addEventListener("click", function () {
      localStorage.removeItem(CLAVE_FOTO);
      mostrarFoto("");
    });

    mostrarFoto(localStorage.getItem(CLAVE_FOTO) || "");
    cargarPerfil();

  })();
  </script>
</body>
</html>PERFIL ACUDIENTE
