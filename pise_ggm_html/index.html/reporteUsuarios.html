<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de Usuarios | PISE-GGM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    .cabecera {
      background: linear-gradient(135deg, #198754, #14532d);
      color: #fff;
      border-radius: 14px;
      padding: 24px 32px;
      margin-bottom: 24px;
    }
    .tabla-reporte th {
      background: #198754;
      color: #fff;
      font-size: .9rem;
    }
    .tabla-reporte td {
      font-size: .9rem;
      vertical-align: middle;
    }
    .badge-rol {
      font-size: .78rem;
    }
  </style>
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-success" href="administrador.html">PISE-GGM</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span id="nombreUsuario" class="fw-semibold"></span>
        <a href="administrador.html" class="btn btn-outline-success btn-sm">
          <i class="bi bi-arrow-left"></i> Volver al panel
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <div class="cabecera">
      <h1 class="h4 mb-1">Reporte de Usuarios</h1>
      <p class="mb-0 small">Listado general de usuarios registrados en el sistema</p>
    </div>

    <!-- FILTROS -->
    <div class="row g-3 mb-3">

      <div class="col-md-4">
        <label class="form-label small fw-semibold">Filtrar por rol</label>
        <select id="filtroRol" class="form-select">
          <option value="">Todos los roles</option>
          <option value="1">Estudiante</option>
          <option value="2">Acudiente</option>
          <option value="3">Docente</option>
          <option value="4">Administrador</option>
        </select>
      </div>

      <div class="col-md-5">
        <label class="form-label small fw-semibold">Buscar</label>
        <input type="text" id="buscador" class="form-control"
               placeholder="Nombre, apellido o documento...">
      </div>

      <div class="col-md-3 d-flex align-items-end">
        <span class="badge bg-secondary fs-6" id="contador">0 registros</span>
      </div>

    </div>

    <!-- TABLA -->
    <div class="table-responsive bg-white rounded shadow-sm">
      <table class="table table-striped table-hover mb-0 tabla-reporte">
        <thead>
          <tr>
            <th>#</th>
            <th>Tipo Doc.</th>
            <th>Documento</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Rol</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla">
          <tr>
            <td colspan="8" class="text-center text-muted py-4">Cargando...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>

    const API_REPORTES = "http://localhost:8082/api/reportes";

    // ---- Guardia de sesión: solo Administrador ----
    const token = localStorage.getItem("token");
    const usuarioRaw = localStorage.getItem("usuario");

    if (!token || !usuarioRaw) {
      window.location.href = "login.html";
    }

    const usuarioSesion = JSON.parse(usuarioRaw);
    const rolSesion = ((usuarioSesion.rol && usuarioSesion.rol.nombreRol) || "").trim();

    if (rolSesion.toUpperCase() !== "ADMINISTRADOR") {
      window.location.href = "login.html";
    }

    document.getElementById("nombreUsuario").textContent =
      usuarioSesion.nombre + " " + usuarioSesion.apellido;

    // ---- Estado en memoria ----
    let usuarios = [];

    // ---- Carga de datos ----
    async function cargarUsuarios(idRol) {

      const url = idRol
        ? API_REPORTES + "/usuarios/rol/" + idRol
        : API_REPORTES + "/usuarios";

      mostrarCargando();

      try {
        const respuesta = await fetch(url);

        if (!respuesta.ok) {
          throw new Error("El servidor respondió con estado " + respuesta.status);
        }

        usuarios = await respuesta.json();
        pintarTabla();

      } catch (error) {
        console.error(error);
        mostrarError("No se pudo conectar con el servidor. Verifica que el backend esté encendido.");
      }
    }

    // ---- Render ----
    function pintarTabla() {

      const texto = document.getElementById("buscador").value.trim().toLowerCase();

      const filtrados = usuarios.filter(function (u) {
        if (texto === "") return true;
        const nombre = (u.nombre || "").toLowerCase();
        const apellido = (u.apellido || "").toLowerCase();
        const documento = (u.numeroDocumento || "").toLowerCase();
        return nombre.includes(texto) || apellido.includes(texto) || documento.includes(texto);
      });

      const cuerpo = document.getElementById("cuerpoTabla");
      document.getElementById("contador").textContent = filtrados.length + " registros";

      if (filtrados.length === 0) {
        cuerpo.innerHTML =
          '<tr><td colspan="8" class="text-center text-muted py-4">Sin resultados</td></tr>';
        return;
      }

      cuerpo.innerHTML = filtrados.map(function (u, indice) {
        return "<tr>" +
          "<td>" + (indice + 1) + "</td>" +
          "<td>" + limpiar(u.tipoDocumento) + "</td>" +
          "<td>" + limpiar(u.numeroDocumento) + "</td>" +
          "<td>" + limpiar(u.nombre) + "</td>" +
          "<td>" + limpiar(u.apellido) + "</td>" +
          "<td>" + limpiar(u.telefono) + "</td>" +
          "<td>" + limpiar(u.email) + "</td>" +
          '<td><span class="badge bg-success badge-rol">' + limpiar(u.rol) + "</span></td>" +
          "</tr>";
      }).join("");
    }

    function mostrarCargando() {
      document.getElementById("cuerpoTabla").innerHTML =
        '<tr><td colspan="8" class="text-center text-muted py-4">Cargando...</td></tr>';
    }

    function mostrarError(mensaje) {
      document.getElementById("cuerpoTabla").innerHTML =
        '<tr><td colspan="8" class="text-center text-danger py-4">' + mensaje + "</td></tr>";
      document.getElementById("contador").textContent = "0 registros";
    }

    // Evita que un dato con < o > rompa el HTML de la tabla.
    function limpiar(valor) {
      if (valor === null || valor === undefined || valor === "") return "—";
      return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ---- Eventos ----
    document.getElementById("filtroRol").addEventListener("change", function () {
      cargarUsuarios(this.value);
    });

    document.getElementById("buscador").addEventListener("input", pintarTabla);

    // ---- Inicio ----
    cargarUsuarios("");

  </script>

</body>
</html>
