<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Docente</title>

<style>
body { 
  font-family: Arial; 
  margin:0;   
  background: url(ANIMADOCOLGGM.png) no-repeat center center/cover;
  position: relative;
}

/* OSCURECER FONDO */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: -1;
}

/* HEADER */
header {
  background: white;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  color: #285900;
}

/* MENÚ */
nav a {
  margin: 0 10px;
  text-decoration: none;
  color: #333;
}

nav a:hover {
  color: #2e7d32;
}

/* CONTENEDOR */
.container {
  padding: 30px;
  color: white;
}

/* TARJETAS */
.cards {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.9);
  color: black;
  padding: 20px;
  border-radius: 15px;
  width: 300px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* TABLA */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  padding: 8px;
  border: 1px solid #ccc;
  text-align: center;
}

th {
  background: #2e7d32;
  color: white;
}
</style>

</head>

<body>

<header>
  <h1>PISE-GGM - DOCENTE</h1>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="login.html">Cerrar sesión</a>
  </nav>
</header>

<div class="container">

  <h1>Bienvenido Docente</h1>

  <div class="cards">

    <!-- INFORMACIÓN -->
    <div class="card">
      <h3>Información</h3>
      <p><b>Nombre:</b> Juan Pérez</p>
      <p><b>Materia:</b> Matemáticas</p>
      <p><b>Correo:</b> jperez@colegio.com</p>
    </div>

    <!-- HORARIO -->
    <div class="card">
      <h3>Horario</h3>
      <table>
        <tr>
          <th>Día</th>
          <th>Clase</th>
        </tr>
        <tr>
          <td>Lunes</td>
          <td>Matemáticas</td>
        </tr>
        <tr>
          <td>Martes</td>
          <td>Álgebra</td>
        </tr>
        <tr>
          <td>Miércoles</td>
          <td>Geometría</td>
        </tr>
      </table>
    </div>

    <!-- NOTAS -->
    <div class="card">
      <h3>Notas</h3>
      <table>
        <tr>
          <th>Estudiante</th>
          <th>Nota</th>
        </tr>
        <tr>
          <td>Ana</td>
          <td>4.5</td>
        </tr>
        <tr>
          <td>Carlos</td>
          <td>3.8</td>
        </tr>
        <tr>
          <td>Luisa</td>
          <td>4.2</td>
        </tr>
      </table>
    </div>

  </div>

</div>

</body>
</html>
